<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="340">
<foreignObject width="680" height="340">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.wrap{width:680px;height:340px;background:#07050f;overflow:hidden;position:relative}

/* orbits */
.orbit{position:absolute;top:50%;left:50%;border-radius:50%;border:1px dashed rgba(160,100,220,0.18);transform:translate(-50%,-50%)}
.o1{width:300px;height:140px;border-color:rgba(140,80,210,0.13);animation:spin1 22s linear infinite}
.o2{width:238px;height:112px;border-color:rgba(155,95,220,0.18);animation:spin1 14s linear infinite reverse}
.o3{width:174px;height:82px;border-color:rgba(175,115,230,0.22);animation:spin1 9s linear infinite}
.o4{width:114px;height:54px;border-color:rgba(195,140,240,0.30);animation:spin1 5.5s linear infinite reverse}
.o5{width:64px;height:30px;border-color:rgba(215,170,250,0.40);animation:spin1 3s linear infinite}

@keyframes spin1{from{transform:translate(-50%,-50%) rotateZ(0deg) rotateX(72deg)}to{transform:translate(-50%,-50%) rotateZ(360deg) rotateX(72deg)}}

/* nodes on orbits */
.node{position:absolute;border-radius:50%;background:#d4b8f0}
.n{width:4px;height:4px;top:-2px;left:calc(50% - 2px);box-shadow:0 0 6px 2px rgba(190,140,240,0.7)}

/* pulse rings */
.pulse{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(140,80,220,0.5);transform:translate(-50%,-50%);animation:pulseOut 3.6s ease-out infinite}
.p2{animation-delay:1.2s}
.p3{animation-delay:2.4s}
@keyframes pulseOut{
  0%{width:0;height:0;opacity:0.7}
  100%{width:360px;height:170px;opacity:0}
}

/* core */
.core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ede0ff,#a070d8 55%,#5030a0);animation:breathe 4.2s ease-in-out infinite;box-shadow:0 0 18px 4px rgba(160,100,220,0.45),0 0 40px 8px rgba(120,60,200,0.18)}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 18px 4px rgba(160,100,220,0.45),0 0 40px 8px rgba(120,60,200,0.18)}50%{transform:translate(-50%,-50%) scale(1.22);box-shadow:0 0 28px 8px rgba(180,120,240,0.6),0 0 60px 16px rgba(140,80,220,0.22)}}

/* dust particles */
.dust{position:absolute;border-radius:50%;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:0}40%,60%{opacity:1}}

/* synaptic flashes */
.flash{position:absolute;top:50%;left:50%;width:1px;background:linear-gradient(rgba(200,160,240,0),rgba(200,160,240,0.5),rgba(200,160,240,0));transform-origin:0 0;animation:flashAnim linear infinite}
@keyframes flashAnim{0%,100%{opacity:0}45%,55%{opacity:1}}

/* flowing trails around orbits */
.trail{position:absolute;top:50%;left:50%;border-radius:50%;border:none;overflow:hidden;animation:spin1 9s linear infinite}
.trail::after{content:'';position:absolute;top:-1px;left:calc(50% - 1px);width:2px;height:2px;border-radius:50%;background:#c8a0e8;box-shadow:0 0 8px 3px rgba(190,140,240,0.8)}

/* nebula glow blobs */
.blob{position:absolute;border-radius:50%;filter:blur(40px);animation:blobDrift ease-in-out infinite alternate}
.b1{width:180px;height:90px;top:30%;left:20%;background:rgba(100,50,180,0.12);animation-duration:7s}
.b2{width:140px;height:70px;top:25%;left:55%;background:rgba(130,60,200,0.10);animation-duration:9s;animation-delay:2s}
.b3{width:100px;height:50px;top:55%;left:38%;background:rgba(90,40,160,0.10);animation-duration:11s;animation-delay:4s}
@keyframes blobDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(12px,8px) scale(1.1)}}
</style>
<div class="wrap">
  <!-- nebula blobs -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- pulse rings -->
  <div class="pulse"></div>
  <div class="pulse p2"></div>
  <div class="pulse p3"></div>

  <!-- orbits with nodes -->
  <div class="orbit o1"><div class="node n"></div></div>
  <div class="orbit o2"><div class="node n"></div></div>
  <div class="orbit o3"><div class="node n"></div></div>
  <div class="orbit o4"><div class="node n"></div></div>
  <div class="orbit o5"><div class="node n"></div></div>

  <!-- dust -->
  <div class="dust" style="width:2px;height:2px;background:#b090d8;top:18%;left:14%;animation-duration:4.1s;animation-delay:0.3s"></div>
  <div class="dust" style="width:1px;height:1px;background:#c0a0e0;top:72%;left:22%;animation-duration:5.7s;animation-delay:1.1s"></div>
  <div class="dust" style="width:2px;height:2px;background:#a080cc;top:28%;left:78%;animation-duration:3.9s;animation-delay:0.7s"></div>
  <div class="dust" style="width:1px;height:1px;background:#d0b0f0;top:65%;left:68%;animation-duration:6.2s;animation-delay:2.2s"></div>
  <div class="dust" style="width:2px;height:2px;background:#9070c0;top:82%;left:44%;animation-duration:4.8s;animation-delay:1.8s"></div>
  <div class="dust" style="width:1px;height:1px;background:#b8a0e0;top:12%;left:56%;animation-duration:5.3s;animation-delay:0.5s"></div>
  <div class="dust" style="width:2px;height:2px;background:#c090d8;top:48%;left:8%;animation-duration:3.5s;animation-delay:3.0s"></div>
  <div class="dust" style="width:1px;height:1px;background:#a090cc;top:38%;left:88%;animation-duration:6.8s;animation-delay:1.4s"></div>
  <div class="dust" style="width:2px;height:2px;background:#d0a8f0;top:90%;left:80%;animation-duration:4.4s;animation-delay:0.9s"></div>
  <div class="dust" style="width:1px;height:1px;background:#b0a0d8;top:8%;left:35%;animation-duration:5.9s;animation-delay:2.6s"></div>
  <div class="dust" style="width:2px;height:2px;background:#9878c8;top:58%;left:92%;animation-duration:3.2s;animation-delay:1.6s"></div>
  <div class="dust" style="width:1px;height:1px;background:#c8b0e8;top:78%;left:12%;animation-duration:7.1s;animation-delay:0.2s"></div>
  <div class="dust" style="width:2px;height:2px;background:#a868c0;top:22%;left:62%;animation-duration:4.6s;animation-delay:3.4s"></div>
  <div class="dust" style="width:1px;height:1px;background:#d8c0f8;top:44%;left:50%;animation-duration:5.0s;animation-delay:1.0s"></div>
  <div class="dust" style="width:2px;height:2px;background:#8858b8;top:95%;left:30%;animation-duration:3.8s;animation-delay:2.8s"></div>

  <!-- core -->
  <div class="core"></div>
</div>
</div>
</foreignObject>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="300">
<foreignObject width="900" height="300">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.wrap{width:900px;height:300px;background:#06040e;overflow:hidden;position:relative}

.blob{position:absolute;border-radius:50%;animation:blobDrift ease-in-out infinite alternate}
.b1{width:420px;height:180px;top:18%;left:28%;background:rgba(80,30,160,0.22);filter:blur(55px);animation-duration:8s}
.b2{width:260px;height:110px;top:10%;left:38%;background:rgba(110,40,190,0.16);filter:blur(45px);animation-duration:11s;animation-delay:3s}
.b3{width:180px;height:80px;top:50%;left:34%;background:rgba(70,20,140,0.18);filter:blur(40px);animation-duration:9s;animation-delay:1.5s}
@keyframes blobDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(10px,6px) scale(1.08)}}

.pulse{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(140,80,220,0.45);transform:translate(-50%,-50%);animation:pulseOut 4s ease-out infinite}
.p2{animation-delay:1.33s}.p3{animation-delay:2.66s}
@keyframes pulseOut{0%{width:0;height:0;opacity:0.6}100%{width:680px;height:220px;opacity:0}}

.orbit{position:absolute;top:50%;left:50%;border-radius:50%;transform:translate(-50%,-50%)}
.o1{width:560px;height:130px;border:1px dashed rgba(150,90,220,0.14);animation:spin 28s linear infinite}
.o2{width:420px;height:98px;border:1px dashed rgba(165,105,225,0.20);animation:spin 17s linear infinite reverse}
.o3{width:290px;height:68px;border:1px dashed rgba(180,120,230,0.26);animation:spin 10s linear infinite}
.o4{width:178px;height:42px;border:1px dashed rgba(200,145,240,0.34);animation:spin 6s linear infinite reverse}
.o5{width:90px;height:22px;border:1px dashed rgba(220,175,250,0.44);animation:spin 3.2s linear infinite}
@keyframes spin{from{transform:translate(-50%,-50%) rotateZ(0deg) rotateX(75deg)}to{transform:translate(-50%,-50%) rotateZ(360deg) rotateX(75deg)}}

.node{position:absolute;border-radius:50%}
.n{width:4px;height:4px;top:-2px;left:calc(50% - 2px);background:#d4b8f0;box-shadow:0 0 7px 3px rgba(190,140,240,0.75)}
.ns{width:3px;height:3px;top:-1.5px;left:calc(50% - 1.5px);background:#c8a8e8;box-shadow:0 0 5px 2px rgba(180,130,230,0.6)}

.core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f0e4ff,#b080e0 52%,#5828a8);animation:breathe 4.5s ease-in-out infinite;box-shadow:0 0 22px 6px rgba(160,100,225,0.55),0 0 55px 14px rgba(110,50,190,0.22),0 0 90px 30px rgba(90,30,170,0.10)}
@keyframes breathe{
  0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 22px 6px rgba(160,100,225,0.55),0 0 55px 14px rgba(110,50,190,0.22),0 0 90px 30px rgba(90,30,170,0.10)}
  50%{transform:translate(-50%,-50%) scale(1.28);box-shadow:0 0 34px 10px rgba(185,130,245,0.65),0 0 75px 22px rgba(135,70,210,0.28),0 0 120px 45px rgba(100,40,185,0.14)}
}

.dust{position:absolute;border-radius:50%;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:0}45%,55%{opacity:1}}
</style>
<div class="wrap">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="pulse"></div>
  <div class="pulse p2"></div>
  <div class="pulse p3"></div>

  <div class="orbit o1"><div class="node n"></div></div>
  <div class="orbit o2"><div class="node n"></div></div>
  <div class="orbit o3"><div class="node ns"></div></div>
  <div class="orbit o4"><div class="node ns"></div></div>
  <div class="orbit o5"><div class="node n"></div></div>

  <div class="dust" style="width:2px;height:2px;background:#b090d8;top:16%;left:10%;animation-duration:4.2s;animation-delay:0.4s"></div>
  <div class="dust" style="width:1px;height:1px;background:#c0a0e0;top:74%;left:18%;animation-duration:5.8s;animation-delay:1.2s"></div>
  <div class="dust" style="width:2px;height:2px;background:#9868c8;top:24%;left:82%;animation-duration:3.7s;animation-delay:0.8s"></div>
  <div class="dust" style="width:1px;height:1px;background:#d0b0f0;top:68%;left:72%;animation-duration:6.4s;animation-delay:2.3s"></div>
  <div class="dust" style="width:2px;height:2px;background:#8858b8;top:85%;left:42%;animation-duration:5.1s;animation-delay:1.9s"></div>
  <div class="dust" style="width:1px;height:1px;background:#b8a0e0;top:10%;left:58%;animation-duration:4.9s;animation-delay:0.6s"></div>
  <div class="dust" style="width:2px;height:2px;background:#a870c8;top:44%;left:6%;animation-duration:3.4s;animation-delay:3.1s"></div>
  <div class="dust" style="width:1px;height:1px;background:#c898e8;top:32%;left:91%;animation-duration:7.0s;animation-delay:1.5s"></div>
  <div class="dust" style="width:2px;height:2px;background:#d0a8f0;top:92%;left:84%;animation-duration:4.6s;animation-delay:1.0s"></div>
  <div class="dust" style="width:1px;height:1px;background:#a090cc;top:6%;left:32%;animation-duration:6.1s;animation-delay:2.7s"></div>
  <div class="dust" style="width:2px;height:2px;background:#9070c0;top:56%;left:95%;animation-duration:3.3s;animation-delay:1.7s"></div>
  <div class="dust" style="width:1px;height:1px;background:#c8b0e8;top:80%;left:8%;animation-duration:7.3s;animation-delay:0.3s"></div>
  <div class="dust" style="width:2px;height:2px;background:#b068c0;top:20%;left:66%;animation-duration:4.7s;animation-delay:3.5s"></div>
  <div class="dust" style="width:1px;height:1px;background:#d8c0f8;top:48%;left:76%;animation-duration:5.2s;animation-delay:1.1s"></div>
  <div class="dust" style="width:2px;height:2px;background:#7848a8;top:62%;left:28%;animation-duration:4.0s;animation-delay:2.9s"></div>
  <div class="dust" style="width:1px;height:1px;background:#c090d8;top:38%;left:4%;animation-duration:6.6s;animation-delay:0.1s"></div>
  <div class="dust" style="width:2px;height:2px;background:#a080c8;top:88%;left:60%;animation-duration:3.6s;animation-delay:2.0s"></div>
  <div class="dust" style="width:1px;height:1px;background:#b8b0e0;top:4%;left:48%;animation-duration:5.5s;animation-delay:4.0s"></div>

  <div class="core"></div>
</div>
</div>
</foreignObject>
</svg>

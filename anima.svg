<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
<defs>
  <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ede0ff"/>
    <stop offset="60%" stop-color="#b090e0"/>
    <stop offset="100%" stop-color="#7050b8"/>
  </radialGradient>
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c8a5f0" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#c8a5f0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c8a5f0" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#c8a5f0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c8a5f0" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#c8a5f0" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- background -->
<rect width="680" height="420" fill="#080614"/>

<!-- pulse waves -->
<ellipse cx="340" cy="210" rx="0" ry="0" fill="none" stroke="#9467d2" stroke-width="0.8" opacity="0.55">
  <animate attributeName="rx" values="0;195" dur="4.4s" repeatCount="indefinite" begin="0s"/>
  <animate attributeName="ry" values="0;92" dur="4.4s" repeatCount="indefinite" begin="0s"/>
  <animate attributeName="opacity" values="0.55;0" dur="4.4s" repeatCount="indefinite" begin="0s"/>
</ellipse>
<ellipse cx="340" cy="210" rx="0" ry="0" fill="none" stroke="#9467d2" stroke-width="0.8" opacity="0.55">
  <animate attributeName="rx" values="0;195" dur="4.4s" repeatCount="indefinite" begin="1.1s"/>
  <animate attributeName="ry" values="0;92" dur="4.4s" repeatCount="indefinite" begin="1.1s"/>
  <animate attributeName="opacity" values="0.55;0" dur="4.4s" repeatCount="indefinite" begin="1.1s"/>
</ellipse>
<ellipse cx="340" cy="210" rx="0" ry="0" fill="none" stroke="#9467d2" stroke-width="0.8" opacity="0.55">
  <animate attributeName="rx" values="0;195" dur="4.4s" repeatCount="indefinite" begin="2.2s"/>
  <animate attributeName="ry" values="0;92" dur="4.4s" repeatCount="indefinite" begin="2.2s"/>
  <animate attributeName="opacity" values="0.55;0" dur="4.4s" repeatCount="indefinite" begin="2.2s"/>
</ellipse>
<ellipse cx="340" cy="210" rx="0" ry="0" fill="none" stroke="#9467d2" stroke-width="0.8" opacity="0.55">
  <animate attributeName="rx" values="0;195" dur="4.4s" repeatCount="indefinite" begin="3.3s"/>
  <animate attributeName="ry" values="0;92" dur="4.4s" repeatCount="indefinite" begin="3.3s"/>
  <animate attributeName="opacity" values="0.55;0" dur="4.4s" repeatCount="indefinite" begin="3.3s"/>
</ellipse>

<!-- RING 1 (outermost) — 9 nodes, slowest -->
<g opacity="0.18">
  <ellipse cx="340" cy="210" rx="168" ry="80" fill="none" stroke="#8c64c8" stroke-width="0.4" stroke-dasharray="4 9"/>
</g>
<g>
  <!-- nodes on ring 1, distributed, each rotates around ellipse path -->
  <animateTransform attributeName="transform" type="rotate" from="0 340 210" to="360 340 210" dur="105s" repeatCount="indefinite" additive="sum"/>
  <!-- node group for ring1 -->
</g>

